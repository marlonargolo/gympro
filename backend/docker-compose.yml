version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gympro
      POSTGRES_USER: gympro
      POSTGRES_PASSWORD: gympropwd123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  web:
    build: .
    depends_on:
      - db
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn gympro.wsgi:application --config gunicorn.conf.py"
    restart: unless-stopped

volumes:
  postgres_data:
  media_files:
  static_files:
